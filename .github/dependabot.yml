version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Framework and tooling majors need a deliberate compatibility review;
      # the grouped weekly PR remains responsible for minor/patch updates.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the builder on the documented Node LTS line until a major upgrade
      # is explicitly tested across Next.js, vinext and Sites packaging.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
