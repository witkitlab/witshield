name: Release host smoke

on:
  workflow_call:
    inputs:
      version:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-host-smoke-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  ubuntu-native:
    name: Native ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 22.04 amd64
            runner: ubuntu-22.04
          - label: Ubuntu 24.04 amd64
            runner: ubuntu-24.04
          - label: Ubuntu 24.04 arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: Verify and exercise the published standalone CLI without repairs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          ((EUID != 0))
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              cosign_hash=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
              ;;
            aarch64|arm64)
              arch=arm64
              cosign_hash=c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
              ;;
            *) printf 'unsupported runner architecture\n' >&2; exit 1 ;;
          esac
          work_dir=$(mktemp -d "${RUNNER_TEMP}/witshield-cli-smoke.XXXXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT
          asset="witshield_${RELEASE_VERSION#v}_linux_${arch}"
          release_base="https://github.com/witkitlab/witshield/releases/download/${RELEASE_VERSION}"
          for file in "$asset" SHA256SUMS SHA256SUMS.bundle; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              --retry 3 --max-time 180 --output "${work_dir}/${file}" "${release_base}/${file}"
          done

          # Keep the verifier and release identity aligned with scripts/install.sh.
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --max-time 180 --output "${work_dir}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-${arch}"
          printf '%s  %s\n' "$cosign_hash" "${work_dir}/cosign" | sha256sum --check --strict
          chmod 0700 "${work_dir}/cosign"
          "${work_dir}/cosign" verify-blob \
            --bundle "${work_dir}/SHA256SUMS.bundle" \
            --certificate-identity "https://github.com/witkitlab/witshield/.github/workflows/release.yml@refs/tags/${RELEASE_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${work_dir}/SHA256SUMS"
          expected_hash=$(awk -v file="$asset" '$2 == file || $2 == "*" file { print $1 }' "${work_dir}/SHA256SUMS")
          [[ "$expected_hash" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$expected_hash" "${work_dir}/${asset}" | sha256sum --check --strict
          gh attestation verify "${work_dir}/${asset}" \
            --repo witkitlab/witshield \
            --signer-workflow witkitlab/witshield/.github/workflows/release.yml \
            --source-ref "refs/tags/${RELEASE_VERSION}"
          chmod 0755 "${work_dir}/${asset}"

          # Scores below 60 return 1; only usage/runtime failures must fail smoke.
          status=0
          "${work_dir}/${asset}" check --json > "${work_dir}/report.json" || status=$?
          [[ "$status" == 0 || "$status" == 1 ]]
          jq --slurp --exit-status '
            length == 1 and (.[0] |
              type == "object" and
              (.score | type == "number" and . == floor and . >= 0 and . <= 100) and
              (.grade | type == "string" and length > 0) and
              (.summary | type == "object" and
                (.checks | type == "number" and . == floor and . > 0) and
                (.completedChecks | type == "number" and . == floor and . >= 0) and
                (.completedChecks <= .checks) and
                (.coveragePercent | type == "number" and . >= 0 and . <= 100) and
                (.findingCount | type == "number" and . == floor and . >= 0) and
                (.mode | type == "string")) and
              (.findings | type == "array" and all(.[];
                (.severity | type == "string") and
                (.titleZh | type == "string") and
                (.fixable | type == "boolean"))) and
              (.sshFailures | type == "object" and
                (.available | type == "boolean") and
                (if .available then
                  (.total | type == "number" and . == floor and . >= 0) and
                  (.uniqueIPs | type == "number" and . == floor and . >= 0)
                else .total == null and .uniqueIPs == null end))
            )' "${work_dir}/report.json" >/dev/null
          [[ "$status" == "$(jq -r 'if .score < 60 then 1 else 0 end' "${work_dir}/report.json")" ]]
          status=0
          # The runner deliberately owns the captured output, not root.
          # shellcheck disable=SC2024
          sudo -- "${work_dir}/${asset}" check --no-color > "${work_dir}/report.txt" || status=$?
          [[ "$status" == 0 || "$status" == 1 ]]
          grep -Fq '安全分' "${work_dir}/report.txt"
      - name: Exercise install, enrollment, scan, action, rollback, reinstall and purge
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: sudo env WITSHIELD_SMOKE_ALLOW_PURGE=1 bash scripts/smoke-release-install.sh "$RELEASE_VERSION"

  debian-systemd:
    name: Systemd container ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debian 12 amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - label: Debian 12 arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Build clean systemd host
        run: |
          docker build \
            --platform '${{ matrix.platform }}' \
            --build-arg BASE_IMAGE=debian:12-slim \
            --file scripts/tests/fixtures/systemd-host.Dockerfile \
            --tag witshield-release-smoke:debian12 \
            .
          docker run --detach --privileged \
            --cgroupns=host \
            --name witshield-release-smoke \
            --tmpfs /run \
            --tmpfs /run/lock \
            --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            witshield-release-smoke:debian12
      - name: Wait for systemd
        run: |
          for _ in {1..60}; do
            state=$(docker exec witshield-release-smoke systemctl is-system-running 2>/dev/null || true)
            [[ "$state" == running || "$state" == degraded ]] && exit 0
            sleep 1
          done
          docker inspect witshield-release-smoke --format '{{json .State}}' || true
          docker logs witshield-release-smoke || true
          docker exec witshield-release-smoke systemctl --no-pager --full status || true
          exit 1
      - name: Exercise install, enrollment, scan, action, rollback, reinstall and purge
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker cp scripts/smoke-release-install.sh witshield-release-smoke:/tmp/smoke-release-install.sh
          docker exec \
            --env WITSHIELD_SMOKE_ALLOW_PURGE=1 \
            witshield-release-smoke \
            bash /tmp/smoke-release-install.sh "$RELEASE_VERSION"
      - name: Collect logs
        if: always()
        run: |
          docker inspect witshield-release-smoke --format '{{json .State}}' || true
          docker logs witshield-release-smoke || true
          docker exec witshield-release-smoke \
            journalctl --no-pager -n 300 \
              -u witshield-controller.service \
              -u witshield-helper.service \
              -u witshield-agent.service || true
          docker rm --force witshield-release-smoke || true
