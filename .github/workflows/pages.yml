name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Build static public website
        working-directory: web
        run: npm run build:pages
      - name: Disable Jekyll processing
        run: touch web/out/.nojekyll
      - name: Assert public routes
        run: |
          test -s web/out/index.html
          test -s web/out/demo/index.html
          test -s web/out/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/out

  deploy:
    name: Deploy public website
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
